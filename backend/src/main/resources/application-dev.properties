# Perfil de desenvolvimento: SQL visível e detalhes de health expostos.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always

# Segredo JWT só para desenvolvimento (>= 32 caracteres). NUNCA use este valor em produção.
app.jwt.secret=dev-secret-troque-em-producao-0123456789abcdef

# Admin de desenvolvimento (criado pelo seed na primeira subida).
app.admin.email=admin@fishing.local
app.admin.password=admin12345

# Liga os seeds de demonstração (usuário demo + catálogo) em dev.
app.seed.demo.enabled=true
