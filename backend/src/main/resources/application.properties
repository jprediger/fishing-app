spring.application.name=fishing-backend

# Perfil ativo (dev | prod). Default = dev; em produção use SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/fishingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fishing}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fishing123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# ProblemDetail (RFC 7807)
spring.mvc.problemdetails.enabled=true

# OpenAPI (springdoc)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
