spring.application.name=fishing-backend

# Perfil ativo (dev | prod). Default = dev; em produção use SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/fishingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fishing}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fishing123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# ProblemDetail (RFC 7807)
spring.mvc.problemdetails.enabled=true

# OpenAPI (springdoc)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs

# Autenticação JWT (HS256). O segredo NÃO tem default aqui: em prod, defina APP_JWT_SECRET
# (>= 32 caracteres). Em dev, o perfil application-dev.properties fornece um valor de teste.
app.jwt.secret=${APP_JWT_SECRET}
# Validade longa (7 dias) — token único sem refresh; o app re-loga no 401.
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:604800}
app.jwt.issuer=fishing-backend

# CORS: origens permitidas (app mobile nativo não usa CORS; relevante para Swagger/painel web).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# Admin inicial (seed). Sem default aqui: em prod, defina APP_ADMIN_EMAIL/APP_ADMIN_PASSWORD
# (a app falha ao subir se faltarem). Em dev, o perfil application-dev.properties dá defaults.
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.name=${APP_ADMIN_NAME:Administrator}

# Bootstrap mínimo do app. Desligado só no profile `seed`.
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}

# Dispatcher de seed. Desligado no boot normal; ligado no profile/tarefa `seed`.
app.seed.enabled=${APP_SEED_ENABLED:false}
# Seed de dados de demonstração (usuário demo + catálogo). Desligado por padrão; ligado em dev.
app.seed.demo.enabled=${APP_SEED_DEMO_ENABLED:false}
