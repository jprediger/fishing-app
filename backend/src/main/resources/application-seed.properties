# Profile de seed: roda todos seeds e encerra sem subir web server.
spring.main.web-application-type=none

# Postgres+PostGIS local sobe via docker-compose na porta 5440 do host
# (a 5432 é usada por outra instância). Override por SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5440/fishingdb}

# Liga o dispatcher de seeds e todos os seeders conhecidos.
app.bootstrap.enabled=false
app.seed.enabled=true
app.seed.demo.enabled=true
app.seed.water-bodies=true
app.seed.establishments=true

# Valores mínimos para beans que dependem de config em runtime.
app.jwt.secret=seed-secret-troque-em-producao-0123456789abcdef
app.admin.email=admin@fishing.local
app.admin.password=admin12345
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*
