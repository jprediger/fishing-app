# Perfil de produção: sem SQL no log e sem vazar detalhes de health sem autenticação.
spring.jpa.show-sql=false

management.endpoint.health.show-details=when-authorized

# Logging estruturado (JSON no formato ECS / Elastic) no console — nativo do Spring Boot 3.4+.
logging.structured.format.console=ecs
# Metadados de serviço incluídos em cada linha de log.
logging.structured.ecs.service.name=fishing-backend
logging.structured.ecs.service.environment=prod
